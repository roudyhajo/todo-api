spring.application.name=todo-api

# Surchargé automatiquement en prod par les variables d'environnement Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/todo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Désactive les logs SQL verbeux en prod (activés par défaut en local)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}